# Omarchy power tuning — MacBook Air 9,1 (T2, Ice Lake i5-1030NG7)
# Installed to /etc/tlp.d/01-omarchy-macbookair.conf by ./apply.sh
#
#   Re-apply after editing:   sudo tlp start
#   Inspect what's active:    sudo tlp-stat        (or the battery widget → "Full TLP report")
#   Undo everything:          ~/.config/omarchy/power-tuning/revert.sh
#
# TLP replaces power-profiles-daemon. The omarchy.power widget's profile
# buttons no longer do anything once this is active; the battery-plus
# widget's right-click (battery-saver / full-power) is the replacement.

TLP_ENABLE=1
TLP_WARN_LEVEL=3
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=0

# ---- CPU · intel_pstate / HWP -------------------------------------------
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
# thermald still owns the thermal envelope; we only shift the energy bias.
NMI_WATCHDOG=0

# ---- Suspend ----------------------------------------------------------
MEM_SLEEP_ON_AC=deep
MEM_SLEEP_ON_BAT=deep

# ---- PCIe · runtime power management ---------------------------------
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave
# The Apple ANS2 NVMe controller hangs if it autosuspends — apply.sh
# appends a RUNTIME_PM_DENYLIST line with its detected PCI address below.

# ---- GPU · Intel i915 --------------------------------------------
# Left unset — TLP 1.10 rejects a literal 0 ("frequency out of range") and
# the i915 driver already scales the GPU well on its own.

# ---- Audio · snd_hda_intel ------------------------------------------
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ---- Wi-Fi · Broadcom BCM4377 --------------------------------------
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ---- USB autosuspend ----------------------------------------------
# The internal keyboard/trackpad are on the Apple BCE bus, not USB, so
# they are unaffected. Audio, Bluetooth, phones and printers excluded.
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1

# ---- Radios -------------------------------------------------------
WOL_DISABLE=Y
RESTORE_DEVICE_STATE_ON_STARTUP=0
